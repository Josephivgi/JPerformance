name: Release

# Push a tag like v0.2.0 to build JPerformance.exe and publish it as a GitHub
# release. The release notes come from release-notes/<tag>.md, which must exist.
# Running the workflow by hand only builds the exe and keeps it as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag, version and notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $tag) { throw "Tag $tag does not match Cargo.toml version $version" }
          if (-not (Test-Path "release-notes/$tag.md")) { throw "Missing release-notes/$tag.md" }

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Collect exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/JPerformance.exe dist/JPerformance.exe
          (Get-FileHash dist/JPerformance.exe -Algorithm SHA256).Hash.ToLower()

      - uses: actions/upload-artifact@v4
        with:
          name: JPerformance
          path: dist/JPerformance.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist/JPerformance.exe --title "JPerformance $($tag.TrimStart('v'))" --notes-file "release-notes/$tag.md" --verify-tag
