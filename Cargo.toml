[package]
name = "jperformance"
version = "0.1.0"
edition = "2024"
description = "Track Windows app performance over time"

[[bin]]
name = "JPerformance"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow"] }
egui_plot = "0.38.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sysinfo = "0.39.6"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
